name: ARY Services CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/ary-production-grade-experience, upgrade/10-phase-platform-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ary-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend tests and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run frontend unit tests
        run: npm test
      - name: Run security regression checks
        run: npm run test:security-regression
      - name: Build web app
        run: npm run build
      - name: Build separate customer/provider/driver/admin apps
        run: |
          npm run build:customer
          npm run build:provider
          npm run build:driver
          npm run build:admin

  backend-integration:
    name: Backend integration and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Run API integration tests
        run: npm test
        working-directory: server
      - name: Run focused security, grocery and mobility tests
        run: |
          npm run test:security
          npm run test:grocery-storage
          npm run test:mobility
        working-directory: server

  postgres-storage:
    name: PostgreSQL persistence integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ary
          POSTGRES_PASSWORD: ary_test_password
          POSTGRES_DB: ary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ary -d ary_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ary:ary_test_password@localhost:5432/ary_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: node test/postgresStorage.js
        working-directory: server
