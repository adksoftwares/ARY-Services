name: ARY Services CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/ary-production-grade-experience]

permissions:
  contents: read

concurrency:
  group: ary-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  backend-integration:
    name: Backend integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Run backend integration tests
        run: node test/verify.js
        working-directory: server

  postgres-storage:
    name: PostgreSQL persistence integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ary
          POSTGRES_PASSWORD: ary_test_password
          POSTGRES_DB: ary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ary -d ary_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ary:ary_test_password@localhost:5432/ary_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: node test/postgresStorage.js
        working-directory: server
